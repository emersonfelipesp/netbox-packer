repos:
  - repo: local
    hooks:
      - id: public-boundary
        name: Enforce the public repository boundary
        entry: python3 scripts/check_public_boundary.py
        language: system
        pass_filenames: false
      - id: public-boundary-mutations
        name: Mutation-test the public repository boundary
        entry: python3 scripts/check_public_boundary.py --self-test
        language: system
        pass_filenames: false
