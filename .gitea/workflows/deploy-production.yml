name: Deploy NetBox plugin (staging/production)

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (tag, branch, or commit SHA)'
        required: false
      environment:
        description: 'Target environment (optional for main/develop refs)'
        required: false
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy plugin
    runs-on: prod-deploy
    env:
      REF: ${{ inputs.ref || github.sha }}
      REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Deploy plugin
        shell: bash
        run: |
          set -euo pipefail

          # Validate ref format defensively (accepts tags, branches, and commit shas)
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]* | main | develop | [a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9]*) ;;
            *) echo "ERROR: Invalid ref format: $REF"; exit 1 ;;
          esac

          target="${REQUESTED_ENVIRONMENT:-}"
          if [[ -z "$target" ]]; then
            case "${GITHUB_REF_NAME:-}" in
              develop) target="staging" ;;
              main) target="production" ;;
              *) echo "ERROR: Cannot infer deploy target from ref '${GITHUB_REF_NAME:-}'"; exit 1 ;;
            esac
          fi

          case "$target" in
            staging)
              deploy_helper=/opt/nmulticloud/deploy/bin/deploy-netbox-plugin-staging
              web_unit=netbox-staging.service
              worker_unit=netbox-staging-rq.service
              ;;
            production)
              deploy_helper=/opt/nmulticloud/deploy/bin/deploy-netbox-plugin
              web_unit=netbox.service
              worker_unit=netbox-rq.service
              ;;
            *)
              echo "ERROR: Invalid deploy target: $target"
              exit 1
              ;;
          esac

          if [[ ! -x "$deploy_helper" ]]; then
            echo "ERROR: $target deploy helper is not installed on this runner"
            exit 1
          fi

          # Service lifecycle must live under the helper's shared host-wide
          # NetBox deployment lock. Refuse legacy helpers before any mutation:
          # stopping or masking services here would sit outside that lock and
          # race a queued cross-plugin deployment. Contract v1 requires the
          # helper to drain/stop web and RQ before package/schema mutation,
          # handle initially inactive and no-runtime-change deployments, start
          # fresh processes on success, and leave both stopped on failure.
          guard_contract=netbox-service-guard-v1
          if ! "$deploy_helper" --supports "$guard_contract" >/dev/null 2>&1; then
            echo "ERROR: $deploy_helper lacks required $guard_contract support; deploy the coordinated helper update first"
            exit 1
          fi

          NMC_NETBOX_DEPLOY_REQUIRE_SERVICE_GUARD="$guard_contract" \
          NMC_NETBOX_DEPLOY_WEB_UNIT="$web_unit" \
          NMC_NETBOX_DEPLOY_WORKER_UNIT="$worker_unit" \
            "$deploy_helper" netbox-packer "$REF"

          # Do not re-inspect or manipulate services after the helper releases
          # its lock: a queued deployment may already have acquired the lock
          # and stopped them. Success is the helper's locked contract result.
          echo "Completed guard-aware deployment for $web_unit/$worker_unit"
