[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-packer"
version = "0.0.5.post1"
requires-python = ">=3.12.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    # compat.py imports packaging at module scope to compare NetBox release
    # strings. Inside a NetBox install it is transitively guaranteed (NetBox
    # core uses it on the same PluginConfig.validate path), but this package
    # imports it directly, so it belongs in the metadata rather than being
    # inherited by luck.
    "packaging>=23.0",
    "pydantic>=2.0.0",
]
authors = [
    {name = "Emerson Felipe", email = "emersonfelipe.2003@gmail.com"},
]
description = "NetBox plugin for managing Packer VM template builds and catalog"
readme = { file = "README.md", content-type = "text/markdown" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/emersonfelipesp/netbox-packer"
Documentation = "https://emersonfelipesp.github.io/netbox-packer/"
Source = "https://github.com/emersonfelipesp/netbox-packer"
Issues = "https://github.com/emersonfelipesp/netbox-packer/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-django>=4.0.0",
    "pyyaml>=6.0.0",
]
screenshot = [
    "playwright>=1.58.0",
    "requests>=2.33.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_packer*"]

[tool.setuptools.package-data]
netbox_packer = [
    "templates/**",
    "static/**",
    "seeds/**",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-django>=4.0.0",
    "pyyaml>=6.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["B008", "B904", "ARG001", "ARG002"]

[tool.ruff.format]
# `netbox_packer/compat.py` is vendored byte-identically across every Proxbox-family
# NetBox plugin, and those repositories use different `line-length` settings
# (88 here upstream, 100 and 120 elsewhere). Letting each repo reformat it would
# silently break the byte-identity that the cross-repo drift check depends on —
# and that check is the only thing keeping five copies of a compatibility policy
# in agreement. The file is formatted once, at the narrowest width, in
# netbox-proxbox; every other copy takes it verbatim.
exclude = ["netbox_packer/compat.py"]
