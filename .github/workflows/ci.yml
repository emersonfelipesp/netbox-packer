name: CI

on:
  push:
    branches:
      - main
      - v0.0.2
  pull_request:
    branches:
      - main
      - v0.0.2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check for lint errors
        run: ruff check netbox_packer/

      - name: Check code formatting
        run: ruff format --check netbox_packer/

  # ── Static tests ──────────────────────────────────────────────────────────
  static-tests:
    name: Static tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run static tests
        run: pytest tests/ -v

  # ── NetBox compatibility matrix ────────────────────────────────────────────
  # Proves the plugin actually loads, migrates, and reports its support tier on
  # each declared NetBox release, using a **source checkout of the tag** rather
  # than a Docker image: upstream has published no 4.7 image
  # (netboxcommunity/netbox:v4.7.0-beta2 -> 404 on Docker Hub), so the
  # image-based e2e matrix cannot cover the experimental tier at all.
  #
  # netbox-packer is the only plugin in the Proxbox family with no
  # `required_plugins`, so it can be exercised standalone. The companions need a
  # 4.7-capable netbox-proxbox installed alongside them before they can even
  # start, which is why their legs are tracked separately.
  #
  # Refs are pinned to the tags' commit SHAs, not to the tag names, so the
  # matrix cannot move under us.
  netbox-compatibility:
    name: NetBox ${{ matrix.netbox-version }} (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - netbox-version: "v4.5.8"
            netbox-ref: 75e1b86613792458b4d4c8d0cbbfc94df16cfaaf
            tier: stable
          - netbox-version: "v4.6.6"
            netbox-ref: fb8c455ba61b57119a70670612dfdd05e8438b10
            tier: stable
          - netbox-version: "v4.7.0-beta2"
            netbox-ref: aa1d49d0f5021a28e6efc2d0364b84c5bcec7137
            tier: experimental
    services:
      postgres:
        # NetBox 4.7 requires PostgreSQL 15+ and installs the ltree extension
        # during migrate; POSTGRES_USER creates a superuser that can do so.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        # NetBox 4.7 requires Redis 6.0+.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout netbox-packer
        uses: actions/checkout@v4
        with:
          path: netbox-packer
          persist-credentials: false

      - name: Checkout NetBox ${{ matrix.netbox-version }}
        uses: actions/checkout@v4
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox-ref }}
          path: netbox
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NetBox and the plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r netbox/requirements.txt
          python -m pip install -e "./netbox-packer[test]"

      - name: Migrate, check, and assert the reported support tier
        working-directory: netbox-packer
        env:
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_CONFIGURATION: tests.netbox_test_configuration
          NETBOX_TEST_DB_HOST: 127.0.0.1
          NETBOX_TEST_DB_PORT: 5432
          NETBOX_TEST_REDIS_HOST: 127.0.0.1
          NETBOX_TEST_REDIS_PORT: 6379
          EXPECTED_TIER: ${{ matrix.tier }}
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox:${{ github.workspace }}/netbox-packer
        run: |
          set -euo pipefail
          python ../netbox/netbox/manage.py migrate --no-input
          python ../netbox/netbox/manage.py makemigrations netbox_packer --check --dry-run
          # `check` must succeed on every tier. On the experimental tier it also
          # has to emit exactly one netbox_packer.W001 and no errors; on a stable
          # tier it must emit none at all.
          python - <<'PY'
          import os, django
          django.setup()
          from django.core.checks import run_checks
          from django.conf import settings
          from netbox_packer.compat import current_netbox_support_level

          expected = os.environ["EXPECTED_TIER"]
          level = current_netbox_support_level().value
          assert level == expected, f"expected tier {expected!r}, got {level!r} on NetBox {settings.RELEASE.full_version}"

          messages = [m for m in run_checks() if str(getattr(m, "id", "")).startswith("netbox_packer.")]
          errors = [m for m in messages if m.level >= 40]
          assert not errors, f"plugin system checks reported errors: {errors}"

          warnings = [m for m in messages if m.id == "netbox_packer.W001"]
          if expected == "experimental":
              assert len(warnings) == 1, f"expected exactly one W001, got {warnings}"
              assert "experimental" in warnings[0].msg
          else:
              assert not messages, f"stable tier must emit no compatibility notice: {messages}"
          print(f"OK: NetBox {settings.RELEASE.full_version} -> tier {level}, messages {[m.id for m in messages]}")
          PY

      - name: Run the compatibility test module
        working-directory: netbox-packer
        env:
          PYTHONPATH: ${{ github.workspace }}/netbox/netbox:${{ github.workspace }}/netbox-packer
        run: python -m pytest tests/test_netbox_compat.py -q

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate package metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

  # ── NetBox integration tests ──────────────────────────────────────────────
  test:
    name: Test (NetBox v4.6.6 source)
    runs-on: ubuntu-latest
    needs: [lint, static-tests, package]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Run NetBox v4.6.6 source test suite
        env:
          NETBOX_REF: v4.6.6
          NETBOX_PLUGINS_JSON: '["netbox_packer"]'
          MIGRATION_APPS: "netbox_packer"
          TEST_LABELS: "netbox_packer"
          DB_HOST: localhost
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
        run: bash .github/ci/netbox46-source-test.sh
