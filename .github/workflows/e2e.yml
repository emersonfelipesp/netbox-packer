name: e2e

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-docker:
    name: NetBox plugin install + smoke / ${{ matrix.netbox_image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        netbox_image:
          - netboxcommunity/netbox:v4.5.8
          - netboxcommunity/netbox:v4.5.9
          - netboxcommunity/netbox:v4.6.0
          - netboxcommunity/netbox:v4.6.1
          - netboxcommunity/netbox:v4.6.2
          - netboxcommunity/netbox:v4.6.3
          - netboxcommunity/netbox:v4.6.4
          - netboxcommunity/netbox:v4.6.6
          - netboxcommunity/netbox:v4.7.0-5.1.0@sha256:73a54ff279461170032b59a57a1930929965e3ba15c195af59f4b5f6d39a84a9
    env:
      NETBOX_IMAGE: ${{ matrix.netbox_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/

      - name: Smoke-install plugin into NetBox image
        run: |
          set -eux
          docker pull "$NETBOX_IMAGE"
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            "$NETBOX_IMAGE" \
            sh -c '
              uv pip install --python /opt/netbox/venv/bin/python --no-deps /dist/*.whl &&
              /opt/netbox/venv/bin/python -c "import netbox_packer; print(netbox_packer.__name__)"
            '
